name: Feature request
description: Suggest an improvement grounded in a workout workflow
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the training workflow or contributor need, not only the proposed UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: data
    attributes:
      label: Does this change stored workout data?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
